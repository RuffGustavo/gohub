# Desenvolvimento (carregado automaticamente por `docker compose`).
# Código montado por volume; runserver com autoreload e DEBUG ligado.
# O worker e o beat não recarregam sozinhos: após alterar tarefas, rode
#   docker compose restart worker beat

services:
  web:
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    environment:
      DJANGO_DEBUG: "true"
    volumes:
      - .:/app

  worker:
    volumes:
      - .:/app

  beat:
    volumes:
      - .:/app
