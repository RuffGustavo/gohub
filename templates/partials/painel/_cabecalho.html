<header class="nk-header nk-header-fixed is-light">
    <div class="container-fluid">
        <div class="nk-header-wrap">
            <div class="nk-menu-trigger d-xl-none ms-n1">
                <button type="button" class="nk-nav-toggle nk-quick-nav-icon gohub-btn-reset" data-target="sidebarMenu" aria-controls="menu-lateral" aria-label="Abrir menu">
                    <em class="icon ni ni-menu" aria-hidden="true"></em>
                </button>
            </div>
            <div class="nk-header-app-name">
                <div class="nk-header-app-info">
                    <span class="sub-text">GoHub</span>
                    <span class="lead-text">Painel</span>
                </div>
            </div>
            {% if user.is_authenticated %}
                <div class="nk-header-tools">
                    <ul class="nk-quick-nav">
                        <li class="dropdown user-dropdown">
                            <button type="button" class="dropdown-toggle gohub-btn-reset" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menu do usuário">
                                <span class="user-toggle">
                                    <span class="user-avatar sm" aria-hidden="true"><em class="icon ni ni-user-alt"></em></span>
                                </span>
                            </button>
                            <div class="dropdown-menu dropdown-menu-md dropdown-menu-end">
                                <div class="dropdown-inner user-card-wrap bg-lighter">
                                    <div class="user-card">
                                        <div class="user-avatar" aria-hidden="true">
                                            <span>{{ user.get_username|slice:":2"|upper }}</span>
                                        </div>
                                        <div class="user-info">
                                            <span class="lead-text">{{ user.get_full_name|default:user.get_username }}</span>
                                            {% if user.email %}<span class="sub-text">{{ user.email }}</span>{% endif %}
                                        </div>
                                    </div>
                                </div>
                                <div class="dropdown-inner">
                                    <ul class="link-list">
                                        <li><a href="{% url 'users:perfil' %}"><em class="icon ni ni-user-alt" aria-hidden="true"></em><span>Meu perfil</span></a></li>
                                        <li><a href="{% url 'users:perfil-seguranca' %}"><em class="icon ni ni-lock-alt" aria-hidden="true"></em><span>Segurança</span></a></li>
                                    </ul>
                                </div>
                                <div class="dropdown-inner">
                                    <form method="post" action="{% url 'users:logout' %}">
                                        {% csrf_token %}
                                        <ul class="link-list">
                                            <li>
                                                <button type="submit" class="gohub-btn-reset">
                                                    <em class="icon ni ni-signout" aria-hidden="true"></em><span>Sair</span>
                                                </button>
                                            </li>
                                        </ul>
                                    </form>
                                </div>
                            </div>
                        </li>
                    </ul>
                </div>
            {% endif %}
        </div>
    </div>
</header>
